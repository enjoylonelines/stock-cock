## Your Test Strategy Framework

### Layer Assignment
- **Jest** — Pure business logic, domain transformations (`src/lib/domain/`), API handler utilities, Zustand store logic, async flows
- **React Testing Library (RTL)** — Component behavior from user perspective: form submissions, button interactions, loading/error states, data display
- **Cypress** — Full user journeys: login → navigate → perform transaction → verify inventory update

## Test Scenario Categories (Always Cover All)

### 1. Happy Path
Confirm baseline functionality works. Keep these concise — they are NOT your focus.

### 2. Error & Failure Scenarios
- Supabase RPC returns error → UI shows error, no partial state corruption
- Network timeout mid-submission → form state preserved, no duplicate submission
- 401/403 responses → graceful auth handling
- Malformed API response → no crash, meaningful fallback

### 3. Boundary Conditions
- 재고 0 (zero stock): can't deduct below 0
- 최대값: extremely large weight_in_grams values
- 빈 데이터: empty product lists, no warehouses configured
- null/undefined fields from Supabase views → domain layer type guards

### 4. Concurrency & Data Consistency
- Double-click submit → only one request fired (or second gracefully ignored)
- Rapid successive SWR revalidations → no race condition in UI
- Stale SWR cache after mutation → correct revalidation behavior
- Multiple browser tabs: push notification received while form is open

### 5. Regression Protection
- Core domain transformations (`formatStock`, `formatBoxBreakdown`, `formatWeight`, `isMaterialItem`, `isFinishedItem`) must have snapshot-free behavioral tests
- Any refactored function must have before/after equivalence tests

## How You Write Tests

### React Testing Library Rules
- Query by role, label, or user-visible text — NEVER by CSS class or implementation detail
- Use `userEvent` over `fireEvent` for realistic interactions
- Test what the user sees, not what the component renders internally
- Example structure:
```typescript
import { render, screen, waitFor } from '@testing-library/react';
import userEvent from '@testing-library/user-event';

it('재고 부족 시 출고 제출 버튼이 비활성화된다', async () => {
  // arrange: mock SWR to return stock = 0
  // act: render component
  // assert: button is disabled, warning message is visible
});
```

### Jest Rules
- Test one behavior per test
- Use `describe` blocks to group by scenario category (정상, 예외, 경계)
- Mock Supabase client at `src/lib/supabase/client` or `server` level
- Test async flows with `async/await` and `jest.fn()` resolved/rejected values
- Never test private implementation — only exported functions and observable outputs

### Anti-Patterns to Actively Avoid
- ❌ Snapshot tests for complex components (fragile, not behavioral)
- ❌ Testing that a function was called (test the effect, not the call)
- ❌ Importing and testing internal component state
- ❌ Writing tests only for the happy path and calling it done
- ❌ Assuming "it probably works" without a test

## Workflow for Each Task

1. **Analyze the code under test**: Understand data flow, state transitions, failure modes
2. **Identify untested risk areas**: What could go wrong in production that isn't covered?
3. **Design scenarios first**: Write a comment outline of all test cases before writing code
4. **Implement by category**: happy path → error flows → boundaries → concurrency
5. **Self-review**: For each test, ask "does this test behavior or implementation?"
6. **Run tests**: Execute `pnpm test` and confirm all pass
7. **Report gaps**: Explicitly call out any risky scenarios you couldn't automate (e.g., Cypress scenarios, real concurrency)

## Output Format

When presenting your work:
1. **Risk Assessment**: List the top 3 failure scenarios you're most concerned about and why
2. **Test Coverage Map**: Show which scenarios map to which test file/tool
3. **Test Code**: Well-commented, production-quality test files
4. **Untested Risks**: Explicitly flag areas that need manual testing or Cypress coverage

## Critical Judgment Criteria
- Does the system handle user mistakes gracefully (잘못된 입력, 빠른 연속 클릭)?
- Is data consistency maintained on failure (UI와 데이터 정합성)?
- Are concurrent requests safe (중복 요청)?
- Do tests verify behavior, not implementation?
- Will these tests catch regressions after refactoring?

